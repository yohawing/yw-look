name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: NSIS loader pack hook check
        run: npm run check:nsis-loader-packs

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Type check (TypeScript)
        run: |
          npx tsc --noEmit
          npx tsc --noEmit -p tsconfig.node.json

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run selftest integration
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite-dev.log 2>&1 &
          DEV_SERVER_PID=$!
          cleanup() {
            kill "$DEV_SERVER_PID" || true
          }
          trap cleanup EXIT

          READY=0
          for i in $(seq 1 60); do
            if curl -fsS 'http://127.0.0.1:1420/?entry=selftest' >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Vite dev server did not become ready in time."
            exit 1
          fi

          npm run test:integration -- 'http://127.0.0.1:1420/?entry=selftest'

  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build flip_compare helper
        run: >-
          cargo build --manifest-path src-tauri/Cargo.toml
          --bin flip_compare
          --features flip-compare

      - name: Run visual regression
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite-dev.log 2>&1 &
          DEV_SERVER_PID=$!
          cleanup() {
            kill "$DEV_SERVER_PID" || true
          }
          trap cleanup EXIT

          READY=0
          for i in $(seq 1 60); do
            if curl -fsS 'http://127.0.0.1:1420/?entry=selftest' >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Vite dev server did not become ready in time."
            exit 1
          fi

          npm run test:visual -- 'http://127.0.0.1:1420/?entry=selftest' tests/visual/snapshots/selftest-page-linux-chromium.png artifacts/screenshots/selftest-page-current.png
          cleanup
          trap - EXIT

          xvfb-run -a npm run test:viewport-snapshot

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-current
          path: |
            artifacts/screenshots/**/*.png
            artifacts/screenshots/**/*-flip-report.json

  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check (Rust USD backend)
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo test (Rust USD backend)
        run: cargo test --manifest-path src-tauri/Cargo.toml
