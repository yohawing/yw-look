name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-latest
            binary: src-tauri/target/release/yw-look.exe
            args: --features flip-compare --config src-tauri/tauri.windows.json --config src-tauri/tauri.windows.loaders.json --bundles nsis

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-${{ matrix.platform }}
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Require current README screenshot
        run: npm run check:readme-screenshot

      - name: Verify NSIS loader pack hooks (Windows)
        if: runner.os == 'Windows'
        run: npm run check:nsis-loader-packs

      - name: Extract release notes from CHANGELOG
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if [[ ! "$tag" =~ ^v[0-9] ]]; then
            echo "::error::release notes extraction requires a v* tag ref; got: $tag"
            exit 1
          fi
          node scripts/extract-release-notes.mjs --tag "$tag" --check-contract --output release-body.md
          delimiter="YW_LOOK_RELEASE_BODY_$(date +%s)_${RANDOM}"
          {
            echo "body<<$delimiter"
            cat release-body.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Build and upload draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          YW_LOOK_UPDATER_ENDPOINT: https://github.com/yohawing/yw-look/releases/latest/download/latest.json
          YW_LOOK_UPDATER_PUBLIC_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDJCQ0M2RDM1Qzc5RkE4REEKUldUYXFKL0hOVzNNSzNMbmRwUXpPazlRa3NZRzJtTVlKSVFvVHRDK05CellrYXZSRGJlTGR6elYK
        with:
          tagName: ${{ github.ref_name }}
          releaseName: yw-look ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          tauriScript: npm run tauri
          args: ${{ matrix.args }}

      - name: Verify compiled official updater configuration
        run: npm run check:release-updater-config -- --binary "${{ matrix.binary }}" --config-only

      - name: Audit Windows Authenticode status
        continue-on-error: true
        run: npm run check:win-authenticode

      - name: Upload Windows Authenticode audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-authenticode-report-${{ github.ref_name }}-${{ matrix.platform }}
          path: |
            artifacts/logs/win-authenticode-report.json
            artifacts/logs/win-authenticode-report.md
          if-no-files-found: ignore

  patch-updater-manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Normalize and verify draft Windows updater assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir manifest
          gh release download "$TAG" --pattern latest.json --dir manifest --clobber
          gh release view "$TAG" --json assets > manifest/release-assets.json
          node <<'NODE'
          const fs = require("fs");
          const path = "manifest/latest.json";
          const latest = JSON.parse(fs.readFileSync(path, "utf8"));
          const nsis = latest.platforms?.["windows-x86_64-nsis"];
          if (!nsis?.url || !nsis?.signature) throw new Error("latest.json is missing windows-x86_64-nsis updater metadata");
          latest.platforms["windows-x86_64"] = { ...nsis };
          const assetNames = new Set(
            JSON.parse(fs.readFileSync("manifest/release-assets.json", "utf8")).assets.map(({ name }) => name),
          );
          const expectedPrefix = `/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.TAG}/`;
          for (const platform of ["windows-x86_64", "windows-x86_64-nsis"]) {
            const entry = latest.platforms[platform];
            const url = new URL(entry.url);
            if (url.origin !== "https://github.com" || !url.pathname.startsWith(expectedPrefix)) {
              throw new Error(`${platform} updater URL does not target this tagged release`);
            }
            const artifactName = decodeURIComponent(url.pathname.slice(expectedPrefix.length));
            if (!artifactName || artifactName.includes("/") || !assetNames.has(artifactName)) {
              throw new Error(`${platform} updater artifact is missing from the draft release: ${artifactName}`);
            }
            if (!assetNames.has(`${artifactName}.sig`)) {
              throw new Error(`${platform} updater signature asset is missing from the draft release: ${artifactName}.sig`);
            }
          }
          fs.writeFileSync(path, `${JSON.stringify(latest, null, 2)}\n`);
          NODE
          version="$(node -p 'require("./package.json").version')"
          # Draft release download URLs return 404 until publication. Asset
          # presence is checked above; public URL reachability is a post-publish check.
          node scripts/check-release-updater-manifest.mjs --manifest manifest/latest.json --expected-version "$version" --skip-url-check
          gh release upload "$TAG" manifest/latest.json --clobber

  publish-release:
    needs: patch-updater-manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
