[package]
name = "yw-look"
version = "0.3.1"
description = "Quick look style asset viewer for CG workflows"
authors = ["OpenAI Codex"]
edition = "2021"
# Pin the default binary so `cargo run` (invoked by `tauri dev`) never
# ambiguates between the main Tauri bin (`yw-look`) and helper CLIs
# like `src/bin/usd_to_glb.rs`.
default-run = "yw-look"

[package.metadata]

[[bin]]
name = "flip_compare"
path = "src/bin/flip_compare.rs"
required-features = ["flip-compare"]

[lib]
name = "yw_look_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
# The build script uses this only when an Alembic preview helper must be
# regenerated. Normal Rust builds use the bundled helper and do not invoke
# CMake or vcpkg.
cmake = { version = "0.1" }

[features]
# The pure-Rust OpenUSD backend is the only USD implementation.
default = ["backend-openusd-rs"]
backend-openusd-rs = []
# Flip comparison helper (flip_compare bin). Optional to avoid pulling
# nv-flip and image into the main Tauri binary build.
flip-compare = ["dep:nv-flip", "dep:image"]

[dependencies]
# Pin the pure-Rust OpenUSD compatibility layer used by yw-look so local,
# CI, and release builds resolve the same source without a sibling checkout.
openusd = { git = "https://github.com/mxpv/openusd.git", rev = "ca52e1ca1326a9e34239f83fd2cdfe5488c5d516", features = ["geom"] }
# Error aggregation for the yw-look-owned stage-query adapter. OpenUSD exposes
# typed errors; this keeps the local multi-query helpers concise without
# changing the upstream error contract.
anyhow = "1"
psd = "0.3.5"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-updater = "2.10.1"
thiserror = "2"
url = "2"
# Phase 5c: USDZ archives are zip files; we open them in the GLB
# extraction path to pull out UsdPreviewSurface texture assets and
# embed them into the glTF binary chunk. openusd already pulls zip 8
# transitively, so this matches its version to share the build.
zip = { version = "8", default-features = false, features = ["deflate"] }
# Visual regression: NVIDIA FLIP perceptual image diff for viewport snapshots.
# Gated behind the `flip-compare` feature so only the flip_compare bin pulls them in.
nv-flip = { version = "0.1", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
glam = { version = "0.33.5", default-features = false, features = ["std", "f64"] }
log = "0.4.34"
tauri-plugin-log = "2.9.0"
# Official safe Rust bindings; the crate compiles and statically links ufbx.c.
ufbx = "0.11.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
ts-rs = "12.0.1"
